# Rozmowy głosowe i wideo: sygnalizacja przeglądarek z serwerem rozmów (LiveKit) przez https://rtc.supon.rzeszow.pl.
#
# Gdzie: Plesk (konto administratora) → Witryny i domeny → rtc.supon.rzeszow.pl → Hosting i DNS → Apache i nginx →
#        na dole „Dodatkowe dyrektywy nginx” → wkleić całość → OK.
# Wcześniej: subdomena rtc.supon.rzeszow.pl w Plesku z certyfikatem Let's Encrypt (SSL/TLS).
#
# Sam obraz i dźwięk idą bezpośrednio do serwera (TCP 7881, UDP 7882-7892), nie przez nginx.
#
# Wyrażenie regularne, nie `location /`: Plesk ma już własne `location /` dla domeny i drugie takie samo dałoby
# błąd „duplicate location”. Regex ma pierwszeństwo przed zwykłym prefiksem, a odnawianie Let's Encrypt
# (`location ^~ /.well-known/acme-challenge/` Pleska) dalej działa, bo ^~ wygrywa z regexem.
location ~ ^/ {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # sygnalizacja trwa całą rozmowę; klient wysyła ping, ale długa cisza nie może zrywać połączenia
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
