# SearXNG — własna metawyszukiwarka dla enrichmentu produktów.
# Docelowo stoi na serwerze (Plesk) obok backendu — patrz install-on-server.sh.
# Ten plik jest dla maszyn z docker compose:
#   docker compose -f deploy/searxng/docker-compose.yml up -d
#
# Port tylko na loopbacku: korzysta z niego wyłącznie PHP z tego samego hosta.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: przetargi-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8088/
      # Zmień na losowy ciąg (openssl rand -hex 32)
      SEARXNG_SECRET: zmien-mnie-na-losowy-ciag-znakow
      UWSGI_WORKERS: 8
      UWSGI_THREADS: 4
