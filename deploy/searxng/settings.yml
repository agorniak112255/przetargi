# Konfiguracja SearXNG pod API JSON dla enrichmentu (PL, bez limitera).
# Silniki dobrane testem deploy/searxng/probe-engines-server.sh z IP serwera.
use_default_settings: true

general:
  instance_name: "Przetargi SearXNG"
  donation_url: false
  contact_url: false

server:
  secret_key: "zmien-mnie-na-losowy-ciag-znakow"
  # limiter blokuje wywołania bez ciasteczek przeglądarki — PHP musi mieć false
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  # json jest wymagany przez backend
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "pl"
  # Domyślnie captcha wyłącza silnik na 24 h — przy rotacji IP warto próbować szybciej
  suspended_times:
    SearxEngineCaptcha: 300
    SearxEngineTooManyRequests: 300
    SearxEngineAccessDenied: 600
    recaptcha_SearxEngineCaptcha: 1800
    cf_SearxEngineCaptcha: 1800
    cf_SearxEngineAccessDenied: 600

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  # 1, nie 2 — ponowienie do zablokowanego silnika tylko przyspiesza ban
  retries: 1
  # Rotacja adresów źródłowych: install-on-server.sh wstawia tu publiczne IP hosta,
  # dzięki czemu kolejne zapytania nie lecą ciągle z tego samego adresu.
  # SOURCE_IPS_PLACEHOLDER

engines:
  # --- przechodzą z serwerowni ---
  - name: qwant
    disabled: false
    timeout: 10.0
  - name: yep
    disabled: false
    timeout: 10.0
  - name: google cse
    disabled: false
    timeout: 10.0

  # --- rezerwa: bywają blokowane, ale gdy trójka wyżej padnie, zostaje cokolwiek.
  #     SearXNG sama je uśpi na 5 min po captchy, więc nie spowalniają na stałe ---
  - name: duckduckgo
    disabled: false
    timeout: 8.0
  - name: brave
    disabled: false
    timeout: 8.0
  - name: startpage
    disabled: false
    timeout: 8.0
  - name: mojeek
    disabled: false
    timeout: 8.0
  - name: bing
    disabled: false
    timeout: 8.0

  # --- captcha / blokada IP serwera: tylko wydłużają zapytanie ---
  - name: google
    disabled: true
  - name: presearch
    disabled: true
  - name: marginalia
    disabled: true
  - name: stract
    disabled: true
  - name: seekr
    disabled: true
  - name: right dao
    disabled: true
  - name: yahoo
    disabled: true

  # --- odpowiadają, ale wynikami bez związku z zapytaniem ---
  - name: bing
    disabled: true

  # --- pusto dla kodów produktów ---
  - name: mojeek
    disabled: true
  - name: wiby
    disabled: true
  - name: crowdview
    disabled: true
  - name: naver
    disabled: true
  - name: wikipedia
    disabled: true
