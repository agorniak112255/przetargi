# Czat: połączenie websocket przeglądarek i dodatku Thunderbirda z serwerem wiadomości (Laravel Reverb).
#
# Gdzie: Plesk → Witryny i domeny → przetargi.supon.rzeszow.pl → Apache i nginx →
#        „Dodatkowe dyrektywy nginx” (Additional nginx directives) → wkleić całość → OK.
#
# Udostępniamy tylko /app/ (połączenia klientów). Ścieżka /apps/ (publikowanie zdarzeń) zostaje
# niedostępna z zewnątrz — aplikacja publikuje lokalnie na 127.0.0.1:8080.

location /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Reverb wysyła ping co 60 s — połączenie bez ruchu nie może być zrywane wcześniej
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
