<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Supon Przetargi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <div id="status" class="status" hidden></div>

  <section id="setup" hidden>
    <p>Dodatek nie jest jeszcze połączony z aplikacją.</p>
    <button id="openOptions" class="primary">Otwórz ustawienia</button>
  </section>

  <section id="known" hidden>
    <p class="lead">Zapytanie <strong id="knownId"></strong> jest już założone.</p>
    <p id="knownReplied" class="muted" hidden></p>
    <button id="insertReply" class="primary">Wstaw odpowiedź do maila</button>
    <button id="openApp" class="secondary">Otwórz w aplikacji</button>
  </section>

  <section id="fresh" hidden>
    <!-- Przycisk na górze: okienko Thunderbirda potrafi uciąć dolną część. -->
    <div class="row">
      <button id="send" class="primary">Wyślij do Przetargów</button>
      <select id="tone" title="Ton odpowiedzi">
        <option value="formal">Ton oficjalny</option>
        <option value="handlowy">Ton handlowy</option>
      </select>
    </div>

    <p class="muted">Treść maila — możesz poprawić przed wysłaniem.</p>
    <textarea id="body" rows="6" spellcheck="false"></textarea>
    <p id="counter" class="muted"></p>
  </section>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
